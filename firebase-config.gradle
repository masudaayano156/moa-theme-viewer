// Optional local Android configuration. Never read a server service-account key.
// Pass -PmoaFirebaseConfig=/absolute/path/google-services.json for a connected build.
def moaConfigPath = providers.gradleProperty('moaFirebaseConfig').orElse('').get()
def moaEndpoint = providers.gradleProperty('moaPushEndpoint').orElse('').get().trim()
def moaFirebaseValues = [google_app_id: '', google_api_key: '', gcm_defaultSenderId: '', project_id: '']
if (moaConfigPath) {
    def moaConfigFile = file(moaConfigPath)
    if (!moaConfigFile.isFile()) throw new GradleException('Android Firebase configuration file is missing.')
    def moaConfig = new groovy.json.JsonSlurper().parse(moaConfigFile)
    if (moaConfig.private_key || moaConfig.type == 'service_account')
        throw new GradleException('A server private key must never be used as Android app configuration.')
    def moaClients = (moaConfig.client ?: []).findAll {
        it.client_info?.android_client_info?.package_name == android.defaultConfig.applicationId
    }
    if (moaClients.size() != 1) throw new GradleException('Firebase Android package configuration does not match this app.')
    moaFirebaseValues.google_app_id = moaClients[0].client_info?.mobilesdk_app_id ?: ''
    moaFirebaseValues.google_api_key = moaClients[0].api_key?.find { it.current_key }?.current_key ?: ''
    moaFirebaseValues.gcm_defaultSenderId = moaConfig.project_info?.project_number ?: ''
    moaFirebaseValues.project_id = moaConfig.project_info?.project_id ?: ''
    if (!(moaFirebaseValues.google_app_id ==~ /1:[0-9]+:android:[A-Za-z0-9]+/) ||
        !(moaFirebaseValues.google_api_key ==~ /[A-Za-z0-9_-]{30,80}/) ||
        !(moaFirebaseValues.gcm_defaultSenderId ==~ /[0-9]+/) ||
        !(moaFirebaseValues.project_id ==~ /[a-z][a-z0-9-]{4,62}/))
        throw new GradleException('Firebase Android identifiers are incomplete or invalid.')
}
if (moaEndpoint) {
    def moaUri = new URI(moaEndpoint)
    if (moaUri.scheme != 'https' || !moaUri.host || !moaUri.host.endsWith('.workers.dev') ||
        moaUri.userInfo || moaUri.port != -1 || moaUri.query || moaUri.fragment ||
        (moaUri.path && moaUri.path != '/'))
        throw new GradleException('The push endpoint must be one explicit HTTPS workers.dev origin.')
    moaEndpoint = 'https://' + moaUri.host.toLowerCase(Locale.ROOT)
}
android.defaultConfig {
    moaFirebaseValues.each { moaName, moaValue -> resValue 'string', moaName, moaValue.toString() }
    resValue 'string', 'moa_push_endpoint', moaEndpoint
}
