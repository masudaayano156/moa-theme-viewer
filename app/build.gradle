plugins { id 'com.android.application' }

android {
    namespace 'app.moa.client'
    compileSdk 35
    defaultConfig {
        applicationId 'app.moa.client'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.8.1'
    }
    buildTypes {
        debug { debuggable true }
        release { debuggable false; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: rootProject.file('firebase-config.gradle')
